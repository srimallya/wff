    <script>
      (function () {
        var theme = localStorage.getItem('wff_theme') || 'dark';
        var resolved = theme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = resolved;
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', resolved === 'dark' ? '#181816' : '#ffffff');
        var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusBar) statusBar.setAttribute('content', resolved === 'dark' ? 'black-translucent' : 'default');
      })();
    </script>
